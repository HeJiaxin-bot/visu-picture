server:
  port: 8123
  servlet:
    context-path: /api
    # cookie 30 天过期
    session:
      cookie:
        max-age: 2592000
spring:
  application:
    name: visupicture
  # 默认激活 local 环境（COS、阿里云 AI 等配置在 application-local.yml 中）
  profiles:
    active: local
  # 数据库配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/visu
    username: root
    password: 1234
  # Redis 配置
  redis:
    database: 0
    host: 127.0.0.1
    port: 6379
    timeout: 5000
  # Session 配置
  session:
    store-type: redis
    # session 30 天后过期
    timeout: 2592000
  # 开放更大的文件上传体积（略高于业务上限 10MB，预留 multipart 编码开销）
  servlet:
    multipart:
      max-file-size: 12MB
      max-request-size: 12MB
  # 空间图片分表
  shardingsphere:
    datasource:
      names: visu
      visu:
        type: com.zaxxer.hikari.HikariDataSource
        driver-class-name: com.mysql.cj.jdbc.Driver
        url: jdbc:mysql://localhost:3306/visu
        username: root
        password: 1234
    rules:
      sharding:
        tables:
          picture:
            actual-data-nodes: visu.picture # 动态分表
            table-strategy:
              standard:
                sharding-column: spaceId
                sharding-algorithm-name: picture_sharding_algorithm  # 使用自定义分片算法
        sharding-algorithms:
          picture_sharding_algorithm:
            type: CLASS_BASED
            props:
              strategy: standard
              algorithmClassName: com.visupicture.manager.sharding.PictureShardingAlgorithm
    props:
      sql-show: true
mybatis-plus:
  configuration:
    # MyBatis 配置
    map-underscore-to-camel-case: false
    # 仅在开发环境打印日志
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    enable-sql-runner: true
    db-config:
      logic-delete-field: isDelete # 全局逻辑删除的实体字段名
      logic-delete-value: 1 # 逻辑已删除值（默认为 1）
      logic-not-delete-value: 0 # 逻辑未删除值（默认为 0）
# 接口文档配置
knife4j:
  enable: true
  openapi:
    title: 接口文档
    version: 1.0
    group:
      default:
        api-rule: package
        api-rule-resources:
          - com.visupicture.controller
# Sa-Token 配置：登录 Cookie 跨站场景（Android APP 内 WebView 来源为 https://localhost）
# 必须同时开启 SameSite=None 与 Secure，浏览器/WebView 才会接受跨站 Cookie
sa-token:
  cookie:
    same-site: None
    secure: true
# 跨域与 WebSocket 来源白名单（逗号分隔）。
# 因上方 SameSite=None 会让 Cookie 随跨站请求携带，必须显式限定来源，
# 否则任意站点都能以受害者身份读写接口。
#
# 各环境域名不同，具体值见对应 profile：
#   本地开发 -> application-local.yml
#   线上部署 -> application-prod.yml
# 此处仅保留「本地开发」作为兜底默认值，避免未指定 profile 时跨域全被拦。
cors:
  allowed-origins: http://localhost:5173,http://localhost:8123,http://127.0.0.1:5173,https://localhost,capacitor://localhost
